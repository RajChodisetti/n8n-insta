<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insta Pipeline</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand-mark" href="#create" aria-label="Insta Pipeline home">
          <span class="brand-glyph" aria-hidden="true">IP</span>
          <span>
            <strong>Insta Pipeline</strong>
            <small id="system-note">Loading...</small>
          </span>
        </a>
        <nav class="topnav" aria-label="Primary">
          <a href="#create">Create</a>
          <a href="#settings">Settings</a>
          <a href="#reviews">Review</a>
          <a href="#pipeline">Pipeline</a>
        </nav>
      </header>

      <main class="workspace">
        <section class="panel create-panel" id="create">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">New Idea</p>
              <h1>Inject an idea and watch the pipeline run.</h1>
            </div>
          </div>

          <form id="idea-form" class="idea-form">
            <label>
              <span>Idea</span>
              <textarea name="abstract_idea" rows="5" placeholder="Example: a forgotten town reappears when a reservoir dries up."></textarea>
            </label>
            <fieldset class="creative-workflow-field">
              <legend>Creative workflow</legend>
              <div class="creative-workflow-options">
                <label class="creative-workflow-option">
                  <input type="radio" name="creative_workflow" value="high_retention_story" checked>
                  <span>
                    <strong>High-Retention Story</strong>
                    <small>Hook-first shorts with stronger curiosity, pacing, and payoff.</small>
                  </span>
                </label>
                <label class="creative-workflow-option">
                  <input type="radio" name="creative_workflow" value="premium_documentary">
                  <span>
                    <strong>Premium Documentary</strong>
                    <small>Atmospheric narrative with cinematic restraint and deeper context.</small>
                  </span>
                </label>
                <label class="creative-workflow-option">
                  <input type="radio" name="creative_workflow" value="sales_conversion">
                  <span>
                    <strong>Sales / Conversion</strong>
                    <small>Pain, proof, offer, and CTA structure for business outcomes.</small>
                  </span>
                </label>
              </div>
            </fieldset>
            <label class="review-toggle">
              <input type="checkbox" name="review_mode" value="true">
              <span>
                <strong>Review generated instructions before each next phase</strong>
                <small>Default runs stay fully automatic when this is off.</small>
              </span>
            </label>
            <label class="review-toggle avatar-consent-toggle">
              <input type="checkbox" name="avatar_consent_confirmed" value="true">
              <span>
                <strong>Use my configured HeyGen avatar and voice when selected</strong>
                <small>I have rights and consent to use the configured HeyGen avatar and voice for Avatar or Hybrid Reel runs.</small>
              </span>
            </label>
            <div class="form-actions">
              <button type="submit" class="primary" name="reel_type" value="image">Image Reel</button>
              <button type="submit" class="secondary" name="reel_type" value="video">Video Reel</button>
              <button type="submit" class="secondary" name="reel_type" value="avatar">Avatar Reel</button>
              <button type="submit" class="secondary" name="reel_type" value="hybrid">Hybrid / Auto Reel</button>
              <span class="inline-status" id="idea-status" aria-live="polite"></span>
            </div>
          </form>
        </section>

        <section class="panel panel-wide" id="settings">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Runtime Settings</p>
              <h2>Providers, models, and avatar options</h2>
            </div>
            <div class="panel-actions">
              <span class="inline-status" id="settings-status" aria-live="polite"></span>
              <button id="save-settings" class="primary" type="submit" form="settings-form">Save Settings</button>
            </div>
          </div>
          <form id="settings-form" class="settings-form"></form>
        </section>

        <section class="panel" id="reviews">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Human Review</p>
              <h2>Pending Approvals</h2>
            </div>
            <button id="refresh-reviews" class="secondary" type="button">Refresh</button>
          </div>
          <div id="review-list" class="review-list"></div>
        </section>

        <section class="panel panel-wide" id="pipeline">
          <div class="panel-header">
            <div>
              <p class="panel-kicker">Pipeline</p>
              <h2>Ideas</h2>
            </div>
            <div class="panel-actions">
              <span class="inline-status" id="topics-status" aria-live="polite"></span>
              <button id="refresh-topics" class="secondary" type="button">Refresh</button>
            </div>
          </div>
          <div id="pipeline-list" class="pipeline-list"></div>
        </section>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
