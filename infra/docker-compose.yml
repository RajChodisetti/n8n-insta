services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-insta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ./state/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: n8n-insta-redis
    restart: unless-stopped
    command: /bin/sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - ./state/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: n8n-insta-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - ./state/minio:/data

  minio-bootstrap:
    image: minio/mc:latest
    container_name: n8n-insta-minio-bootstrap
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET}
      "
    restart: "no"

  n8n:
    image: n8nio/n8n:1.92.2
    container_name: n8n-insta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    env_file:
      - ../.env
      - ./.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_AVAILABLE_BINARY_DATA_MODES: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /files
      REELS_STORAGE_BUCKET: ${MINIO_BUCKET}
      REELS_STORAGE_ENDPOINT: http://minio:9000
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-stub}
      RENDER_PROVIDER: ${RENDER_PROVIDER:-remotion}
      RENDER_WORKER_URL: ${RENDER_WORKER_URL:-}
      RENDER_WORKER_SYNC_URL: ${RENDER_WORKER_SYNC_URL:-http://remotion-renderer:8081/render-sync}
      RENDER_CALLBACK_URL: ${RENDER_CALLBACK_URL:-http://n8n:5678/webhook/render-status-callback}
      RENDER_OUTPUT_PATH_PREFIX: ${RENDER_OUTPUT_PATH_PREFIX:-reels}
      PROMPTS_ROOT: ${PROMPTS_ROOT:-/prompts}
    ports:
      - "${N8N_HOST_PORT}:5678"
    volumes:
      - ./state/n8n:/home/node/.n8n
      - ./state/files:/files
      - ../workflows:/workflows:ro
      - ../prompts:/prompts:ro
      - ../sa-key.json:/secrets/google/sa-key.json:ro

  studio-ui:
    build:
      context: ..
      dockerfile: infra/node-runtime/Dockerfile
    image: n8n-insta-node-runtime:latest
    container_name: n8n-insta-studio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    env_file:
      - ../.env
      - ./.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_RUNNERS_ENABLED: ${N8N_RUNNERS_ENABLED}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_AVAILABLE_BINARY_DATA_MODES: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /files
      REELS_STORAGE_BUCKET: ${MINIO_BUCKET}
      REELS_STORAGE_ENDPOINT: http://minio:9000
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-stub}
      DEFAULT_REEL_TYPE: ${DEFAULT_REEL_TYPE:-video}
      RENDER_PROVIDER: ${RENDER_PROVIDER:-remotion}
      RENDER_WORKER_URL: ${RENDER_WORKER_URL:-}
      RENDER_WORKER_SYNC_URL: ${RENDER_WORKER_SYNC_URL:-http://remotion-renderer:8081/render-sync}
      RENDER_CALLBACK_URL: ${RENDER_CALLBACK_URL:-http://n8n:5678/webhook/render-status-callback}
      RENDER_OUTPUT_PATH_PREFIX: ${RENDER_OUTPUT_PATH_PREFIX:-reels}
      PROMPTS_ROOT: ${PROMPTS_ROOT:-/prompts}
      STUDIO_UI_PORT: 7780
    entrypoint:
      - node
      - /app/studio-ui/server.mjs
    ports:
      - "${STUDIO_UI_HOST_PORT:-7780}:7780"
    volumes:
      - ../:/app
      - /app/node_modules
      - ./state/files:/files
      - ../workflows:/workflows
      - ../prompts:/prompts
      - ../sa-key.json:/secrets/google/sa-key.json:ro

  pipeline-worker:
    build:
      context: ..
      dockerfile: infra/node-runtime/Dockerfile
    image: n8n-insta-node-runtime:latest
    container_name: n8n-insta-pipeline-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      remotion-renderer:
        condition: service_healthy
      studio-ui:
        condition: service_started
    env_file:
      - ../.env
      - ./.env
    environment:
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      REELS_STORAGE_BUCKET: ${MINIO_BUCKET}
      REELS_STORAGE_ENDPOINT: http://minio:9000
      DEFAULT_REEL_TYPE: ${DEFAULT_REEL_TYPE:-video}
      RENDER_PROVIDER: ${RENDER_PROVIDER:-remotion}
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-sync}
      RENDER_WORKER_SYNC_URL: ${RENDER_WORKER_SYNC_URL:-http://remotion-renderer:8081/render-sync}
      RENDER_WORKER_URL: ${RENDER_WORKER_URL:-}
      RENDER_CALLBACK_URL: ${RENDER_CALLBACK_URL:-}
      RENDER_OUTPUT_PATH_PREFIX: ${RENDER_OUTPUT_PATH_PREFIX:-reels}
      PROMPTS_ROOT: ${PROMPTS_ROOT:-/prompts}
      PIPELINE_WORKER_POLL_MS: ${PIPELINE_WORKER_POLL_MS:-5000}
      PIPELINE_STALE_RUNNING_SECONDS: ${PIPELINE_STALE_RUNNING_SECONDS:-900}
    entrypoint:
      - node
      - /app/pipeline/worker.mjs
    volumes:
      - ../:/app
      - /app/node_modules
      - ./state/files:/files
      - ../workflows:/workflows
      - ../prompts:/prompts
      - ../sa-key.json:/secrets/google/sa-key.json:ro

  remotion-renderer:
    build:
      context: ..
      dockerfile: infra/remotion-renderer/Dockerfile
    image: n8n-insta-remotion-renderer:latest
    container_name: n8n-insta-remotion-renderer
    restart: unless-stopped
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    env_file:
      - ../.env
      - ./.env
    environment:
      REELS_STORAGE_BUCKET: ${MINIO_BUCKET}
      REELS_STORAGE_ENDPOINT: http://minio:9000
      RENDER_OUTPUT_PATH_PREFIX: ${RENDER_OUTPUT_PATH_PREFIX:-reels}
      REMOTION_RENDERER_PORT: 8081
      REMOTION_RENDER_STUB: ${REMOTION_RENDER_STUB:-false}
    volumes:
      - ../:/app
      - /app/node_modules
      - ./state/files:/files
      - ../sa-key.json:/secrets/google/sa-key.json:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  render-worker:
    build:
      context: ./render-worker
    container_name: n8n-insta-render-worker
    restart: unless-stopped
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    env_file:
      - ../.env
      - ./.env
    environment:
      REELS_STORAGE_BUCKET: ${MINIO_BUCKET}
      REELS_STORAGE_ENDPOINT: http://minio:9000
      RENDER_CALLBACK_URL: ${RENDER_CALLBACK_URL:-http://n8n:5678/webhook/render-status-callback}
      RENDER_WORKER_PORT: 8080
    volumes:
      - ./state/render-worker:/tmp/render-worker
      - ../workflows:/workflows:ro
      - ../sa-key.json:/secrets/google/sa-key.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  default:
    name: n8n-insta-network
